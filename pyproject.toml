[project]
name = "speedtui"
version = "0.1.0"
description = "Terminal internet speed test against Cloudflare's speed endpoints"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "textual>=0.80",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.10"]

[project.scripts]
speedtui = "speedtui.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speedtui"]
