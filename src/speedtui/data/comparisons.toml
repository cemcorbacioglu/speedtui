# ---------------------------------------------------------------------------
# Latency guidance
# ---------------------------------------------------------------------------

[latency]
# Light in optical fibre travels at roughly 2/3 of c (refractive index ~1.47).
fiber_km_per_ms = 200
fiber_source = "Speed of light in glass fibre ≈ 200,000 km/s"

# Upper bounds in ms of round-trip ping. Rule of thumb, not a formal standard.
gaming_source = "Common rule of thumb for online games; not a formal standard"
stability_source = "Rule of thumb for real-time traffic; Cisco voice guidance puts the limit at 30 ms"
[[latency.gaming]]
max_ms = 30
verdict = "great, even for competitive shooters"
short = "great"
[[latency.gaming]]
max_ms = 60
verdict = "good for almost every online game"
short = "good"
[[latency.gaming]]
max_ms = 100
verdict = "fine for casual play; fast shooters may feel a little late"
short = "fine for casual"
[[latency.gaming]]
max_ms = 150
verdict = "noticeable lag in fast-paced games"
short = "laggy"
[[latency.gaming]]
max_ms = 1e9
verdict = "too slow for real-time games"
short = "too slow"

# Jitter tiers in ms (mean difference between consecutive pings).
[[latency.stability]]
max_ms = 5
verdict = "excellent"
[[latency.stability]]
max_ms = 15
verdict = "good"
[[latency.stability]]
max_ms = 30
verdict = "fair"
[[latency.stability]]
max_ms = 1e9
verdict = "poor"

[latency.calls]
# ITU-T G.114 recommends at most 150 ms one-way delay for interactive voice;
# the network part of that is roughly half the round-trip ping.
max_one_way_ms = 150
# Cisco's voice QoS guidance: jitter under 30 ms.
max_jitter_ms = 30
source = "ITU-T G.114 (≤150 ms one-way delay); Cisco voice QoS guidance (jitter ≤30 ms)"
