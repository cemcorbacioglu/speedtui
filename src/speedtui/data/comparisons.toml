# Reference data for the "what does this speed mean" panel.
#
# All figures are APPROXIMATE and meant for rough, real-world comparison.
# Sizes are in decimal gigabytes (1 GB = 1,000,000,000 bytes), as file sizes
# are usually advertised.
#
# short is the label used in the compact results table; icon names a UI glyph.
# kind = "size": shows how long the transfer would take at the measured speed.
# kind = "rate": shows how many of these streams the connection could carry.
# direction picks which measured speed is used.

[[item]]
name = "a 2-hour 4K movie"
short = "4K movie"
icon = "film"
direction = "download"
kind = "size"
gb = 14
source = "Netflix help centre: Ultra HD streaming uses up to ~7 GB per hour"

[[item]]
name = "a big AAA game"
short = "AAA game"
icon = "gamepad"
direction = "download"
kind = "size"
gb = 100
source = "Typical large AAA install; e.g. Steam lists Cyberpunk 2077 at 70 GB and Baldur's Gate 3 at 150 GB"

[[item]]
name = "the Ubuntu 24.04 desktop ISO"
